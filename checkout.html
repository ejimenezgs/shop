<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalizar compra | Casa Glick</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css?v=shop62"></head><body class="checkout-page"><header class="checkout-header"><a class="checkout-back shared-back" href="bolsa.html" aria-label="Volver a la bolsa"><span aria-hidden="true"></span></a><a class="brand product-header__brand" href="index.html#inicio" aria-label="Casa Glick inicio"><img class="brand__logo" src="assets/logo.svg" alt="" aria-hidden="true" /></a></header><main class="checkout-shell"><section class="checkout-copy"><p>CASA GLICK</p><h1>Finaliza tu solicitud</h1><span id="checkout-intro">Captura tus datos para generar tu orden y continuar por WhatsApp con un asesor.</span></section><section class="checkout-card"><form id="checkout-form"><div class="checkout-grid"><label><span>Nombre completo</span><input name="name" required></label><label><span>Teléfono</span><input name="phone" type="tel" inputmode="numeric" autocomplete="tel" minlength="10" maxlength="10" pattern="[0-9]{10}" title="Ingresa un teléfono de 10 números" required></label><label><span>Correo</span><input name="email" type="email" required></label><label><span>Ciudad o C.P.</span><input name="city" required></label></div><label class="checkout-delivery"><span>Tipo de entrega</span><span class="checkout-select-control"><select name="delivery" required><option value="">Selecciona una opción</option><option>Recoger en showroom</option><option>Envío a domicilio</option></select><i aria-hidden="true"></i></span></label><label><span>Comentarios</span><textarea name="comments" rows="4" placeholder="Indicaciones, horarios o detalles adicionales"></textarea></label><div class="checkout-order-summary" id="checkout-summary"></div><button class="checkout-submit" id="checkout-submit" type="submit">Generar orden</button><p class="checkout-mode-note" id="checkout-mode-note" hidden></p><p class="checkout-error" id="checkout-error" role="alert"></p></form></section></main><script src="js/cart.js?v=shop62"></script><script src="js/catalog-api.js?v=shop62"></script><script src="js/firebase-public-config.js?v=shop62"></script><script type="module" src="js/checkout.js?v=shop62"></script>
  <aside class="cookie-banner" data-cookie-banner aria-hidden="true" aria-label="Preferencias de cookies">

      <div class="cookie-banner__copy">
        <p class="cookie-banner__eyebrow">Cookies</p>
        <h2>Tu experiencia, bajo control.</h2>
        <p>Usamos cookies necesarias para que la tienda funcione y, con tu permiso, cookies adicionales para mejorar la experiencia.</p>
      </div>
      <div class="cookie-banner__actions">
        <button class="cookie-banner__button cookie-banner__button--secondary" type="button" data-cookie-reject>Solo necesarias</button>
        <button class="cookie-banner__button cookie-banner__button--primary" type="button" data-cookie-accept>Aceptar</button>
      </div>
      <button class="cookie-banner__close" type="button" aria-label="Cerrar aviso de cookies" data-cookie-close>×</button>
    </div>
  </aside>

  <script src="js/cookie-consent.js?v=shop62"></script>
</body></html>
