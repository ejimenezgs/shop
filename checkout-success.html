<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmación de pago | Casa Glick</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css?v=shop62"></head><body class="confirmation-page"><header class="checkout-header confirmation-header"><a class="brand product-header__brand" href="index.html#inicio" aria-label="Casa Glick inicio"><img class="brand__logo" src="assets/logo.svg" alt="" aria-hidden="true" /></a></header><main class="confirmation-shell"><section class="confirmation-card stripe-result-card"><p class="confirmation-eyebrow">CASA GLICK</p><h1 id="stripe-success-status">Confirmando tu pago…</h1><div class="stripe-result-details" id="stripe-success-details"></div><button class="checkout-submit stripe-retry" id="stripe-success-retry" type="button" hidden>Volver a validar</button><a class="stripe-result-link" href="productos.html?filter=todo">Volver al catálogo</a></section></main><script src="js/cart.js?v=shop62"></script><script type="module" src="js/checkout-success.js?v=shop62"></script>
  <aside class="cookie-banner" data-cookie-banner aria-hidden="true" aria-label="Preferencias de cookies">
    <div class="cookie-banner__content">
      <div class="cookie-banner__copy">
        <p class="cookie-banner__eyebrow">Cookies</p>

        <button class="cookie-banner__button cookie-banner__button--primary" type="button" data-cookie-accept>Aceptar</button>
      </div>
      <button class="cookie-banner__close" type="button" aria-label="Cerrar aviso de cookies" data-cookie-close>×</button>
    </div>
  </aside>
