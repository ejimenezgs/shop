<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirmación | Casa Glick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=shop63">
</head>
<body class="confirmation-page">
  <header class="checkout-header confirmation-header">
    <a class="brand product-header__brand" href="index.html#inicio" aria-label="Casa Glick inicio"><img class="brand__logo" src="assets/logo.svg" alt="" aria-hidden="true" /></a>
  </header>

  <main class="confirmation-shell">
    <section class="confirmation-card" aria-live="polite">
      <p class="confirmation-eyebrow">ORDEN GENERADA</p>
      <h1 id="confirmation-folio">CG</h1>
      <p class="confirmation-copy">Tu solicitud fue guardada. Un asesor podrá darle seguimiento con este folio.</p>
      <a class="confirmation-whatsapp" id="confirmation-whatsapp" href="#" target="_blank" rel="noopener">Abrir WhatsApp</a>
      <a class="confirmation-products" href="productos.html?filter=todo">Volver a productos</a>
    </section>
  </main>

  <script src="js/confirmacion.js?v=shop63"></script>

  <aside class="cookie-banner" data-cookie-banner aria-hidden="true" aria-label="Preferencias de cookies">
    <div class="cookie-banner__content">
      <div class="cookie-banner__copy">
        <p class="cookie-banner__eyebrow">Cookies</p>
        <h2>Tu experiencia, bajo control.</h2>
        <p>Usamos cookies necesarias para que la tienda funcione y, con tu permiso, cookies adicionales para mejorar la experiencia.</p>
      </div>
      <div class="cookie-banner__actions">
        <button class="cookie-banner__button cookie-banner__button--secondary" type="button" data-cookie-reject>Solo necesarias</button>
        <button class="cookie-banner__button cookie-banner__button--primary" type="button" data-cookie-accept>Aceptar</button>
      </div>
      <button class="cookie-banner__close" type="button" aria-label="Cerrar aviso de cookies" data-cookie-close>×</button>
    </div>
  </aside>

  <script src="js/cookie-consent.js?v=shop63"></script>
</body>
</html>
